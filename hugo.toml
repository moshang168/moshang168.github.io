baseURL = 'https://moshang168.github.io/'
title = '我的博客'
theme = "reimu"

# 相对路径模式，自动适配任意部署子路径，避免CSS/JS 404
relativeURLs = true

# 站点语言
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"

# 首页显示的文章目录
mainSections = ["posts"]
# 分页数量
paginate = 10

# 代码高亮配置
pygmentsUseClasses = true
pygmentsCodeFences = true
pygmentsCodefencesGuessSyntax = true
