baseURL = 'https://moshang168.cloudns.org/'
title = '墨殇个人博客'
theme = "reimu"

# 首页默认展示 posts 目录下的文章列表
mainSections = ["posts"]
# 每页显示的文章数量
paginate = 10

defaultContentLanguage = 'zh-CN'
defaultContentLanguageInSubdir = false
hasCJKLanguage = true

[languages.zh-CN]
  languageName = "简体中文"
  weight = 1
  languageCode = "zh-cn"
  title = '墨殇个人博客'

# 启用代码高亮
pygmentsUseClasses = true
pygmentsCodeFences = true
pygmentsCodefencesGuessSyntax = true
