baseURL = 'https://moshang168.github.io/My-blog/'
title = '我的博客'
theme = "reimu"

# GitHub Pages子路径部署必须开启相对路径，避免CSS/JS 404
relativeURLs = true
relativeURLsTimeout = 10000

# 站点语言
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"

# 首页显示的文章目录
mainSections = ["posts"]
# 分页数量
paginate = 10

# 代码高亮配置
pygmentsUseClasses = true
pygmentsCodeFences = true
pygmentsCodefencesGuessSyntax = true
